<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" font-family="Segoe UI,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b794ff"/><stop offset="1" stop-color="#e04bff"/></linearGradient>
<filter id="gl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
<clipPath id="rc"><rect x="20" y="20" width="80" height="80" rx="24"/></clipPath>
</defs>
<rect x="20" y="20" width="80" height="80" rx="24" fill="#a855f7" filter="url(#gl)"><animate attributeName="opacity" values=".35;.8;.35" dur="3s" repeatCount="indefinite"/></rect>
<g><animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3.4s" repeatCount="indefinite"/>
<rect x="20" y="20" width="80" height="80" rx="24" fill="url(#lg)" stroke="#ffffff" stroke-opacity=".3" stroke-width="1.5"/>
<g clip-path="url(#rc)"><g transform="skewX(-20)"><rect x="-30" y="10" width="14" height="110" fill="#fff" opacity=".35"><animate attributeName="x" values="-30;150" dur="3.4s" repeatCount="indefinite"/></rect></g></g>
<text x="60" y="76" text-anchor="middle" font-size="52" font-weight="800" fill="#ffffff">W</text>
</g></svg>
